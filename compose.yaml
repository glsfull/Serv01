services:
  api:
    build: .
    environment:
      SERV01_DATABASE_URL: postgresql+psycopg://serv01:serv01@database:5432/serv01
      SERV01_ENVIRONMENT: production
      SERV01_JWT_SECRET: ${SERV01_JWT_SECRET:?Set SERV01_JWT_SECRET before starting Compose}
      SERV01_REDIS_URL: redis://redis:6379/0
      SERV01_ALLOWED_HOSTS: ${SERV01_ALLOWED_HOSTS:-example.com,www.iana.org,httpbin.org}
      SERV01_SCREENSHOT_DIR: /data/screenshots
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - serv01-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    environment:
      SERV01_DATABASE_URL: postgresql+psycopg://serv01:serv01@database:5432/serv01
      SERV01_ENVIRONMENT: production
      SERV01_JWT_SECRET: ${SERV01_JWT_SECRET:?Set SERV01_JWT_SECRET before starting Compose}
      SERV01_REDIS_URL: redis://redis:6379/0
      SERV01_ALLOWED_HOSTS: ${SERV01_ALLOWED_HOSTS:-example.com,www.iana.org,httpbin.org}
      SERV01_SCREENSHOT_DIR: /data/screenshots
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - serv01-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from redis import Redis; assert Redis.from_url('redis://redis:6379/0').ping()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: serv01
      POSTGRES_USER: serv01
      POSTGRES_PASSWORD: serv01
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serv01 -d serv01"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  serv01-data:
