{% extends "base.html" %}
{% block title %}Новый шаблон · Serv01{% endblock %}
{% block content %}
<div class="narrow"><p class="eyebrow">Данные</p><h1>Новый шаблон</h1>{% if error %}<p class="alert">{{ error }}</p>{% endif %}<form method="post" class="panel stack"><label>Название<input name="name" required></label><label>Полное имя<input name="full_name"></label><label>Почта<input type="email" name="email"></label><label>Телефон<input name="phone"></label><label>Город<input name="city"></label><label>Комментарий<textarea name="comment" rows="4"></textarea></label><div class="actions"><button>Сохранить</button><a class="button secondary" href="/templates">Отмена</a></div></form></div>
{% endblock %}
